# =============================================================================
# PostgreSQL 17 - production config for a homelab
# Tuned for: 14 GB RAM, 12 vCPU, NVMe SSD, mixed OLTP / web workload.
# Loaded via: postgres -c config_file=/etc/postgresql/postgresql.conf
# Re-tune the memory/parallelism numbers if your host RAM changes.
# =============================================================================

# --- Connections -------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# --- Authentication & location of the HBA file -------------------------------
password_encryption = scram-sha-256
hba_file = '/etc/postgresql/pg_hba.conf'

# --- Memory ------------------------------------------------------------------
shared_buffers = 3GB                 # ~25% of RAM
effective_cache_size = 9GB           # ~65% of RAM (planner hint, not allocated)
work_mem = 16MB                      # per sort/hash node, per connection - keep modest
maintenance_work_mem = 512MB         # VACUUM, CREATE INDEX, ALTER TABLE
huge_pages = try

# --- WAL & checkpoints -------------------------------------------------------
wal_level = replica                  # switch to 'logical' if you need logical replication
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
max_wal_senders = 10
wal_compression = on
# Wire these up when you add WAL archiving (e.g. pgBackRest):
# archive_mode = on
# archive_command = 'pgbackrest --stanza=main archive-push %p'

# --- Planner (SSD) -----------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- Parallelism -------------------------------------------------------------
max_worker_processes = 12
max_parallel_workers = 12
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# --- Autovacuum --------------------------------------------------------------
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_cost_limit = 1000

# --- Client / statement timeouts --------------------------------------------
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6
idle_in_transaction_session_timeout = 15min   # kill stuck/pooled transactions
statement_timeout = 0                          # set per-role or per-app if desired
lock_timeout = 0

# --- Logging (goes to docker logs; log rotation handled by the json-file driver)
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000    # log statements slower than 1s (0 = log everything)
log_connections = on
log_disconnections = on
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# --- Observability -----------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on
track_functions = pl

# --- Locale & formatting -----------------------------------------------------
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
